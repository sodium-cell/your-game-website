<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aster — Official Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #08090d;
            color: white;
            font-family: Arial, sans-serif;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 90px;
            letter-spacing: 15px;
        }

        .hero p {
            font-size: 20px;
            color: #aaa;
            margin-top: 15px;
        }

        .button {
            margin-top: 40px;
            padding: 15px 40px;
            border: 1px solid white;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .button:hover {
            background: white;
            color: black;
        }
    </style>
</head>

<body>

    <section class="hero">

        <h1>ASTER</h1>

        <p>
            A world divided between Humans and the Awakened.
        </p>

        <a href="#world" class="button">
            ENTER THE WORLD
        </a>

    </section>

</body>
</html>
